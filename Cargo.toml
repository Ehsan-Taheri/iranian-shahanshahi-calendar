[package]
name = "imperial-cal"
version = "0.1.6"
edition = "2024"
authors = ["Ehsan Taheri"]
description = "A library to convert dates to the Iranian Shahanshahi calendar"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Ehsan-Taheri/iranian-shahanshahi-calendar"

[lib]
name = "imperial_cal"
crate-type = ["cdylib", "rlib"] 

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

pyo3 = { version = "0.21", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["wasm-bindgen"]
python = ["pyo3/extension-module"]

[package.metadata.maturin]
features = ["python"]